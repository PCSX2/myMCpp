# Configuration for actions/labeler

"GUI/Qt":
  - changed-files:
    - any-glob-to-any-file:
      - 'src/ui/**/*'

"Core":
  - changed-files:
    - any-glob-to-any-file:
      - 'src/core/**/*'

"Build | Project System":
  - changed-files:
    - any-glob-to-any-file:
      - '**/CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**/*'
      - '.github/**/*'
      - 'scripts/**/*'

"OS: Linux":
  - changed-files:
    - any-glob-to-any-file:
      - '**/*EGL*'
      - '**/*linux*'
      - '**/*Wayland*'
      - '**/*X11*'

"OS: Windows":
  - changed-files:
    - any-glob-to-any-file:
      - '**/*WGL*'
      - '**/*win32*'
      - 'resources/myMCpp.rc'

"OS: macOS":
  - changed-files:
    - any-glob-to-any-file:
      - 'src/core/renderer/Metal/**/*'
      - '**/*AGL*'
      - '**/*.mm'
      - '**/*Cocoa*'

"CLI":
  - changed-files:
    - any-glob-to-any-file:
      - 'src/cli/**/*'

"Renderer: Vulkan":
  - changed-files:
    - any-glob-to-any-file:
      - '**/vulkan*'
      - '**/Vulkan*'
      - 'src/core/renderer/Vulkan/**/*'

"Renderer: OpenGL":
  - changed-files:
    - any-glob-to-any-file:
      - '**/opengl*'
      - '**/OpenGL*'
      - 'src/core/renderer/OpenGL/**/*'

"Renderer: Metal":
  - changed-files:
    - any-glob-to-any-file:
      - '**/metal*'
      - '**/Metal*'
      - 'src/core/renderer/Metal/**/*'

"Documentation":
  - changed-files:
    - any-glob-to-any-file:
      - 'docs/**/*'
      - 'README.md'
      - 'LICENSE'
      - 'build.md'
