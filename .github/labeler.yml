# Configuration for actions/labeler

"GUI/Qt":
  - changed-files:
    - any-glob-to-any-file:
      - 'src/ui/**/*'

"Core":
  - changed-files:
    - any-glob-to-any-file:
      - 'src/core/**/*'

"Build | Project System":
  - changed-files:
    - any-glob-to-any-file:
      - 'CMakeLists.txt'
      - 'cmake/**/*'
      - '.github/**/*'
      - 'scripts/**/*'

"Linux":
  - changed-files:
    - any-glob-to-any-file:
      - '**/*EGL*'
      - '**/*linux*'
      - '**/*Wayland*'
      - '**/*X11*'

"Windows":
  - changed-files:
    - any-glob-to-any-file:
      - '**/*WGL*'
      - '**/*win32*'
      - 'resources/myMCpp.rc'

"macOS":
  - changed-files:
    - any-glob-to-any-file:
      - 'src/core/renderer/Metal/**/*'
      - '**/*AGL*'
      - '**/*.mm'
      - '**/*Cocoa*'

"CLI":
  - changed-files:
    - any-glob-to-any-file:
      - 'src/cli/**/*'

"Vulkan":
  - changed-files:
    - any-glob-to-any-file:
      - '**/vulkan*'
      - '**/Vulkan*'
      - 'src/core/renderer/Vulkan/**/*'

"OpenGL":
  - changed-files:
    - any-glob-to-any-file:
      - '**/opengl*'
      - '**/OpenGL*'
      - 'src/core/renderer/OpenGL/**/*'

"Metal":
  - changed-files:
    - any-glob-to-any-file:
      - '**/metal*'
      - '**/Metal*'
      - 'src/core/renderer/Metal/**/*'

"Documentation":
  - changed-files:
    - any-glob-to-any-file:
      - 'docs/**/*'
      - 'README.md'
      - 'LICENSE.md'
      - 'build.md'
