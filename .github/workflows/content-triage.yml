# Labels Pull Requests based on the presence of platform-specific macros in the code
name: Content Triage

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  macro-detection:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Fetch PR diff
        id: diff
        run: |
          # Use GitHub CLI to get the diff and look for macros in added lines
          DIFF=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --patch)
          
          # Detect macros in added lines (starting with +)
          if echo "$DIFF" | grep -E "^\+.*defined\(_WIN32\)" > /dev/null; then
            echo "win=true" >> $GITHUB_OUTPUT
          fi
          if echo "$DIFF" | grep -E "^\+.*defined\(__APPLE__\)" > /dev/null; then
            echo "mac=true" >> $GITHUB_OUTPUT
          fi
          if echo "$DIFF" | grep -E "^\+.*defined\(__linux__\)" > /dev/null; then
            echo "linux=true" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Windows Label
        if: steps.diff.outputs.win == 'true'
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --add-label "Windows"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply macOS Label
        if: steps.diff.outputs.mac == 'true'
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --add-label "macOS"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Linux Label
        if: steps.diff.outputs.linux == 'true'
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --add-label "Linux"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
