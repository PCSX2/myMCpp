# Release workflow for myMCpp (dev).
# Inspired by PCSX2's release workflow.

name: 🌙 Dev Builds

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cut_release:
    if: github.repository == 'PCSX2/myMCpp'
    name: 'Create tag and draft release'
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.release_meta.outputs.new_tag }}
      release_name: ${{ steps.release_meta.outputs.release_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag, notes, and draft release
        id: release_meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --no-recurse-submodules

          SHA="${{ github.sha }}"

          HIGHEST_TAG=$(git tag -l "v*" | grep -E '^v[0-9]+\.[0-9]*[13579]\.[0-9]+$' | sort -V | tail -n 1 || true)

          if [ -z "$HIGHEST_TAG" ]; then
            echo "Error: No development tag found in repository" >&2
            exit 1
          fi

          MAJOR=$(echo "$HIGHEST_TAG" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\1/')
          MINOR=$(echo "$HIGHEST_TAG" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\2/')
          PATCH=$(echo "$HIGHEST_TAG" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\3/')
          NEW_PATCH=$((PATCH + 1))
          TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          NAME="myMCpp ${TAG}"
          PRERELEASE=true

          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git tag -fa "$TAG" -m "$NAME" "$SHA"
          git push -f origin "refs/tags/$TAG"

          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$SHA" \
            --jq .body > "$GITHUB_WORKSPACE/release-notes.md"

          gh release delete "$TAG" --yes 2>/dev/null || true
          EXTRA=""
          if [ "$PRERELEASE" = true ]; then EXTRA="--prerelease"; fi
          gh release create "$TAG" \
            --draft \
            $EXTRA \
            --title "$NAME" \
            --notes-file "$GITHUB_WORKSPACE/release-notes.md" \
            --target "$SHA"

          echo "new_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=${NAME}" >> "$GITHUB_OUTPUT"

  build_linux_x64_clang:
    if: github.repository == 'PCSX2/myMCpp'
    name: '🐧 Linux x64 (Clang, Dev)'
    needs: cut_release
    uses: ./.github/workflows/linux_build.yml
    with:
      jobName: 'Linux x64 Clang Dev Build'
      artifactPrefixName: 'myMCpp-dev-linux-x64-clang'
      platform: x64
      compiler: clang
      fetchTags: true
    secrets: inherit

  build_linux_arm64_clang:
    if: github.repository == 'PCSX2/myMCpp'
    name: '🐧 Linux ARM64 (Clang, Dev)'
    needs: cut_release
    uses: ./.github/workflows/linux_build.yml
    with:
      jobName: 'Linux ARM64 Clang Dev Build'
      artifactPrefixName: 'myMCpp-dev-linux-arm64-clang'
      os: ubuntu-24.04-arm
      platform: arm64
      compiler: clang
      fetchTags: true
    secrets: inherit

  build_macos:
    if: github.repository == 'PCSX2/myMCpp'
    name: '🍎 macOS (Dev)'
    needs: cut_release
    uses: ./.github/workflows/macos_build.yml
    with:
      jobName: 'macOS Dev Build'
      artifactPrefixName: 'myMCpp-dev-macos-universal'
      fetchTags: true
    secrets: inherit

  build_windows_x64_clang:
    if: github.repository == 'PCSX2/myMCpp'
    name: '🪟 Windows x64 (Clang, Dev)'
    needs: cut_release
    uses: ./.github/workflows/windows_build.yml
    with:
      jobName: 'Windows x64 Clang Dev Build'
      artifactPrefixName: 'myMCpp-dev-windows-x64-clang'
      platform: x64
      compiler: clang
      fetchTags: true
    secrets: inherit

  build_windows_x64_msvc:
    if: github.repository == 'PCSX2/myMCpp'
    name: '🪟 Windows x64 (MSVC, Dev)'
    needs: cut_release
    uses: ./.github/workflows/windows_build.yml
    with:
      jobName: 'Windows x64 MSVC Dev Build'
      artifactPrefixName: 'myMCpp-dev-windows-x64-msvc'
      platform: x64
      compiler: msvc
      fetchTags: true
    secrets: inherit

  build_windows_arm64_clang:
    if: github.repository == 'PCSX2/myMCpp'
    name: '🪟 Windows ARM64 (Clang, Dev)'
    needs: cut_release
    uses: ./.github/workflows/windows_build.yml
    with:
      jobName: 'Windows ARM64 Clang Dev Build'
      artifactPrefixName: 'myMCpp-dev-windows-arm64-clang'
      os: windows-11-arm
      platform: ARM64
      compiler: clang
      fetchTags: true
    secrets: inherit

  build_windows_arm64_msvc:
    if: github.repository == 'PCSX2/myMCpp'
    name: '🪟 Windows ARM64 (MSVC, Dev)'
    needs: cut_release
    uses: ./.github/workflows/windows_build.yml
    with:
      jobName: 'Windows ARM64 MSVC Dev Build'
      artifactPrefixName: 'myMCpp-dev-windows-arm64-msvc'
      os: windows-11-arm
      platform: ARM64
      compiler: msvc
      fetchTags: true
    secrets: inherit

  upload_and_publish:
    if: github.repository == 'PCSX2/myMCpp'
    name: '📦 Upload assets and publish release'
    runs-on: ubuntu-latest
    needs:
      - cut_release
      - build_linux_x64_clang
      - build_linux_arm64_clang
      - build_macos
      - build_windows_x64_clang
      - build_windows_x64_msvc
      - build_windows_arm64_clang
      - build_windows_arm64_msvc
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Prepare release assets
        shell: bash
        env:
          TAG: ${{ needs.cut_release.outputs.new_tag }}
        run: |
          mkdir -p release-assets
          OUT="$(pwd)/release-assets"

          for dir in artifacts/*windows*/; do
            [[ "$dir" == *"-symbols"* ]] && continue
            name=$(basename "$dir")
            (cd "$dir" && zip -rq "$OUT/myMCpp-${TAG}-${name#myMCpp-dev-}.zip" .)
          done

          for f in artifacts/*macos*/*.tar.xz artifacts/*linux*/*.AppImage; do
            name=$(basename "$f")
            mv "$f" "release-assets/myMCpp-${TAG}-${name#myMCpp-dev-}"
          done

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.cut_release.outputs.new_tag }}
        run: gh release upload "$TAG" release-assets/* --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.cut_release.outputs.new_tag }}
        run: gh release edit "$TAG" --draft=false
