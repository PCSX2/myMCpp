# Release workflow for myMCpp (stable).
# Inspired by PCSX2's release workflow.

name: 🏷️ Stable Release

on:
  push:
    tags:
    - 'v*.[0-9]*[02468].[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  cut_release:
    if: github.repository == 'PCSX2/myMCpp'
    name: 'Create draft release'
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.release_meta.outputs.new_tag }}
      release_name: ${{ steps.release_meta.outputs.release_name }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Tag, notes, and draft release
      id: release_meta
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        git fetch --tags --no-recurse-submodules

        if [ -n "${{ inputs.tag || '' }}" ]; then
          TAG="${{ inputs.tag }}"
        else
          TAG="${GITHUB_REF_NAME}"
        fi

        NAME="myMCpp ${TAG}"

        gh api "repos/${{ github.repository }}/releases/generate-notes" \
          -f tag_name="$TAG" \
          --jq .body > "$GITHUB_WORKSPACE/release-notes.md"

        gh release delete "$TAG" --yes 2>/dev/null || true
        gh release create "$TAG" \
          --draft \
          --title "$NAME" \
          --notes-file "$GITHUB_WORKSPACE/release-notes.md" \
          --target "$TAG"

        echo "new_tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "release_name=${NAME}" >> "$GITHUB_OUTPUT"

  build_linux_x64_clang:
    if: github.repository == 'PCSX2/myMCpp'
    name: '🐧 Linux x64 (Clang, Stable)'
    needs: cut_release
    uses: ./.github/workflows/linux_build.yml
    with:
      jobName: 'Linux x64 Clang Stable Build'
      artifactPrefixName: 'myMCpp-stable-linux-x64-clang'
      platform: x64
      compiler: clang
      fetchTags: true
    secrets: inherit

  build_linux_arm64_clang:
    if: github.repository == 'PCSX2/myMCpp'
    name: '🐧 Linux ARM64 (Clang, Stable)'
    needs: cut_release
    uses: ./.github/workflows/linux_build.yml
    with:
      jobName: 'Linux ARM64 Clang Stable Build'
      artifactPrefixName: 'myMCpp-stable-linux-arm64-clang'
      os: ubuntu-24.04-arm
      platform: arm64
      compiler: clang
      fetchTags: true
    secrets: inherit

  build_macos:
    if: github.repository == 'PCSX2/myMCpp'
    name: '🍎 macOS (Stable)'
    needs: cut_release
    uses: ./.github/workflows/macos_build.yml
    with:
      jobName: 'macOS Stable Build'
      artifactPrefixName: 'myMCpp-stable-macos-universal'
      fetchTags: true
    secrets: inherit

  build_windows_x64_clang:
    if: github.repository == 'PCSX2/myMCpp'
    name: '🪟 Windows x64 (Clang, Stable)'
    needs: cut_release
    uses: ./.github/workflows/windows_build.yml
    with:
      jobName: 'Windows x64 Clang Stable Build'
      artifactPrefixName: 'myMCpp-stable-windows-x64-clang'
      platform: x64
      compiler: clang
      fetchTags: true
    secrets: inherit

  build_windows_x64_msvc:
    if: github.repository == 'PCSX2/myMCpp'
    name: '🪟 Windows x64 (MSVC, Stable)'
    needs: cut_release
    uses: ./.github/workflows/windows_build.yml
    with:
      jobName: 'Windows x64 MSVC Stable Build'
      artifactPrefixName: 'myMCpp-stable-windows-x64-msvc'
      platform: x64
      compiler: msvc
      fetchTags: true
    secrets: inherit

  build_windows_arm64_clang:
    if: github.repository == 'PCSX2/myMCpp'
    name: '🪟 Windows ARM64 (Clang, Stable)'
    needs: cut_release
    uses: ./.github/workflows/windows_build.yml
    with:
      jobName: 'Windows ARM64 Clang Stable Build'
      artifactPrefixName: 'myMCpp-stable-windows-arm64-clang'
      os: windows-11-arm
      platform: ARM64
      compiler: clang
      fetchTags: true
    secrets: inherit

  build_windows_arm64_msvc:
    if: github.repository == 'PCSX2/myMCpp'
    name: '🪟 Windows ARM64 (MSVC, Stable)'
    needs: cut_release
    uses: ./.github/workflows/windows_build.yml
    with:
      jobName: 'Windows ARM64 MSVC Stable Build'
      artifactPrefixName: 'myMCpp-stable-windows-arm64-msvc'
      os: windows-11-arm
      platform: ARM64
      compiler: msvc
      fetchTags: true
    secrets: inherit

  upload_and_publish:
    if: github.repository == 'PCSX2/myMCpp'
    name: '📦 Upload assets and publish release'
    runs-on: ubuntu-latest
    needs:
    - cut_release
    - build_linux_x64_clang
    - build_linux_arm64_clang
    - build_macos
    - build_windows_x64_clang
    - build_windows_x64_msvc
    - build_windows_arm64_clang
    - build_windows_arm64_msvc
    steps:
    - uses: actions/checkout@v7

    - name: Download all artifacts
      uses: actions/download-artifact@v8.0.1
      with:
        path: artifacts

    - name: Prepare release assets
      shell: bash
      env:
        TAG: ${{ needs.cut_release.outputs.new_tag }}
      run: |
        mkdir -p release-assets
        OUT="$(pwd)/release-assets"

        for dir in artifacts/*windows*/; do
          [[ "$dir" == *"-symbols"* ]] && continue
          name=$(basename "$dir")
          (cd "$dir" && zip -rq "$OUT/myMCpp-${TAG}-${name#myMCpp-stable-}.zip" .)
        done

        for f in artifacts/*macos*/*.tar.xz artifacts/*linux*/*.AppImage; do
          name=$(basename "$f")
          mv "$f" "release-assets/myMCpp-${TAG}-${name#myMCpp-stable-}"
        done

    - name: Upload release assets
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.cut_release.outputs.new_tag }}
      run: gh release upload "$TAG" release-assets/* --clobber

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.cut_release.outputs.new_tag }}
      run: gh release edit "$TAG" --draft=false
